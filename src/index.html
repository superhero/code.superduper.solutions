<html lang="en" class="dark" data-theme="dark" data-palette="bonfire">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="./favicon.ico">
    <link rel="icon" type="image/png" sizes="96x96" href="./favicon.png">
    <link rel="icon" type="image/svg+xml" sizes="any" href="./assets/favicon.svg?inline">
    <link rel="apple-touch-icon" type="image/png" sizes="180x180" href="./apple-touch-icon.png">
    <title>code.superduper.solutions</title>
    <script>
      // Apply the cached appearance before the first paint; IndexedDB replaces it at startup.
      try {
        const cached = JSON.parse(localStorage.getItem("code.appearance.v1") || "null");
        if (cached?.version === 1 && (cached.theme === "light" || cached.theme === "dark")
          && typeof cached.palette === "string" && /^[a-z][a-z0-9-]{0,63}$/.test(cached.palette)) {
          document.documentElement.dataset.theme = cached.theme;
          document.documentElement.dataset.palette = cached.palette;
          if (["montserrat", "system", "serif", "monospace"].includes(cached.interfaceFont))
            document.documentElement.dataset.interfaceFont = cached.interfaceFont;
          if (typeof cached.interfaceFont === "string" && cached.interfaceFont.startsWith("google:")
            && /^[\p{L}\p{N} ._+-]{1,100}$/u.test(cached.interfaceFont.slice(7))) {
            document.documentElement.dataset.interfaceFont = cached.interfaceFont;
            document.documentElement.style.setProperty("--font-interface", JSON.stringify(cached.interfaceFont.slice(7)) + ", system-ui, sans-serif");
          }
          if (["small", "medium", "large"].includes(cached.interfaceSize))
            document.documentElement.dataset.interfaceSize = cached.interfaceSize;
          document.documentElement.classList.toggle("dark", cached.theme === "dark");
        }
      } catch { /* Continue with the default appearance when the cache is unavailable. */ }
    </script>
    <link rel="stylesheet" href="./app.css">
    <style>
      html:not([data-developer-toolbar="true"]) dev-toolbar { opacity: 0 !important; visibility: hidden !important; pointer-events: none !important; }
    </style>
  </head>
  <body>
    <div id="startup-status" data-prerendered="true" role="status" aria-label="Loading code editor" aria-live="off">
      <!-- startup-preview -->
    </div>
    <div id="app" inert aria-busy="true"></div>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
